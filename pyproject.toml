[project]
name = "pitwall"
version = "0.1.0"
description = "F1 race-strategy simulator built on historical OpenF1 timing data"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
agent = [
    "anthropic>=2.10.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Use a uv-managed interpreter, not whatever Python happens to be on PATH
# (e.g. a conda base env), so the environment is reproducible elsewhere.
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# A small set: real errors (pyflakes), serious pycodestyle checks, and import order. No style opinions.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src", "app.py"]

[[tool.mypy.overrides]]
# These libraries ship no type information; their values are treated as Any.
module = ["pandas", "pandas.*", "sklearn", "sklearn.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# An optional extra (uv sync --extra agent): not installed in CI or in the app's image.
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
