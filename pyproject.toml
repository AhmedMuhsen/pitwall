[project]
name = "pitwall"
version = "0.1.0"
description = "F1 race-strategy simulator built on historical OpenF1 timing data"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Use a uv-managed interpreter, not whatever Python happens to be on PATH
# (e.g. a conda base env), so the environment is reproducible elsewhere.
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
